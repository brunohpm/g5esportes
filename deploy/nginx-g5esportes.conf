# Vhost do site da G5 no nginx que já roda no VPS 2.25.182.14.
#
# Este arquivo é ADITIVO: não toca em nenhum dos vhosts existentes
# (formiz, metodoaxion, casadoauau). Nenhum deles é `default_server`, e um
# Host desconhecido hoje responde 404 — então acrescentar um server_name novo
# não muda o roteamento de nada que já funciona.
#
# Instalação:
#   scp deploy/nginx-g5esportes.conf root@2.25.182.14:/etc/nginx/sites-available/g5esportes
#   ssh root@2.25.182.14 'ln -sf /etc/nginx/sites-available/g5esportes /etc/nginx/sites-enabled/g5esportes \
#                         && nginx -t && systemctl reload nginx'
#
# Depois o certificado (o certbot reescreve este arquivo acrescentando o bloco
# 443 e o redirect, como já fez em formiz.com.br e metodoaxion.com.br):
#   ssh root@2.25.182.14 'certbot --nginx -d g5.prattsolutions.com.br --non-interactive --agree-tos -m SEU@EMAIL'
#
# Sempre `nginx -t` antes de `systemctl reload nginx`: um reload com sintaxe
# inválida mantém a config antiga, mas um restart derrubaria os três sites.

server {
    listen 80;
    listen [::]:80;
    server_name g5.prattsolutions.com.br;

    # O painel do Payload recebe fotos de prova; o padrão de 1 MB é pouco.
    client_max_body_size 50M;

    access_log /var/log/nginx/g5esportes.access.log;
    error_log  /var/log/nginx/g5esportes.error.log;

    # O matcher do proxy do Next exclui caminhos com extensão, então o redirect
    # de /wp-login.php gerado pela migração nunca dispararia. Resolver aqui
    # também poupa a ida ao Node — é endereço muito varrido por robô.
    location = /wp-login.php { return 301 /admin; }
    location = /xmlrpc.php   { return 410; }

    # Uploads e assets com hash no nome: o arquivo muda de nome quando muda de
    # conteúdo, então o navegador pode guardar para sempre.
    # (Cache no disco do nginx exigiria proxy_cache_path no bloco http, que é
    # compartilhado com os outros sites — não vale mexer lá por isto.)
    location ~ ^/(api/midia/file|_next/static)/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Sem headers de Upgrade/Connection: a aplicação não usa WebSocket em
        # produção, e mandar "Connection: upgrade" em toda requisição quebraria
        # o keepalive com o upstream. O par correto exigiria um `map` no bloco
        # http, que é compartilhado com os outros três sites.

        # O admin do Payload faz uploads grandes e consultas mais demoradas.
        proxy_read_timeout    120s;
        proxy_send_timeout    120s;
        proxy_connect_timeout 10s;

        # proxy_buffering fica LIGADO (padrão): é o nginx que absorve cliente
        # lento, em vez de segurar um worker do Node para cada um.
    }
}
